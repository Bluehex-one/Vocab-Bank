<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vocab Vault</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>
    
    <main class="container">
        <header style="position: relative;">
            <h1>Vocab Vault <span class="ai-badge">AI</span></h1>
            <p>Store and define your vocabulary seamlessly across subjects.</p>
            <button id="settings-btn" class="settings-btn" title="API Settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </header>

        <section class="add-word-section glass-panel">
            <form id="add-word-form">
                <div class="input-group">
                    <select id="section-select" class="section-dropdown">
                        <option value="maths">Maths</option>
                        <option value="chinese">Chinese</option>
                        <option value="french">French</option>
                        <option value="humanities">Humanities</option>
                        <option value="science">Science</option>
                        <option value="digital-technology">Digital Technology</option>
                    </select>
                    <input type="text" id="word-input" placeholder="Enter a new word..." required autocomplete="off">
                    <button type="submit" class="btn-primary">Add Word</button>
                </div>
            </form>
        </section>

        <!-- Navigation Tabs -->
        <nav class="tabs-nav" id="tabs-nav">
            <button class="tab-btn active" data-section="maths">Maths</button>
            <button class="tab-btn" data-section="chinese">Chinese</button>
            <button class="tab-btn" data-section="french">French</button>
            <button class="tab-btn" data-section="humanities">Humanities</button>
            <button class="tab-btn" data-section="science">Science</button>
            <button class="tab-btn" data-section="digital-technology">Digital Tech</button>
        </nav>

        <section class="vocabulary-section">
            <div id="vocab-list" class="vocab-grid">
                <!-- Word cards will be injected here by JS -->
            </div>
            
            <div id="empty-state" class="empty-state hidden">
                <p>No words in this section yet. Add a word above to get started!</p>
            </div>
        </section>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <button class="close-btn" id="close-settings">&times;</button>
            <h2 style="margin-bottom: 1rem; color: var(--primary);">API Settings</h2>
            <p style="margin-bottom: 1.5rem; color: var(--text-muted); font-size: 0.95rem;">
                Enter a <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color: #a5b4fc;">Google Gemini API Key</a> to get true AI definitions for all subjects! If left blank, we'll fall back to Wikipedia.
            </p>
            <div class="input-group" style="flex-direction: column;">
                <input type="password" id="api-key-input" placeholder="Paste your API key here..." style="margin-bottom: 1rem;">
                <button id="save-api-key" class="btn-primary">Save Settings</button>
            </div>
            <div id="settings-status" class="hidden" style="margin-top: 1rem; color: #34d399; font-size: 0.9rem; text-align: center;">Settings saved!</div>
        </div>
    </div>

    <script src="app_v3.js"></script>
</body>
</html>
